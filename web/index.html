    <style id="expo-reset">
      html {
        background-color: #0B0813 !important;

      }

        height: -webkit-fill-available;
        margin: 0;
        padding: 0;
        background-color: #0B0813 !important;
        overflow: hidden;
        /* Safe area handling */
        padding-top: env(safe-area-inset-top);
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
        background-color: #0B0813 !important;
      }
    </style>
